# Batch 4 H3 (v11) — value-net training config on heuristic-opponent games.
#
# Same smoke ResNet 16ch/2 blocks and same recipe as b3-h2-train-4350.yaml
# (batch 64, lr 0.002 cosine, warmup 20, augmentation on, internal
# val_fraction 0.05) — the ONLY change is the data: v1-vs-v0 games
# (4,000 generated, deduped, 10% held out) instead of weak neural
# self-play. 5 epochs, as in the 4,350-game retrain.
#
# Data: heuristic-vs-heuristic games (ml/gomoku_ml/heuristic_games.py),
# generated into ml/runs/b4-h3/data/ with the same game-level hold-out
# protocol as v8 (every 10th shard by sorted name ->
# ml/runs/b4-h3/val-data/, NEVER passed to this config).
#
# Run (from the worktree root):
#   OMP_NUM_THREADS=1 TORCH_THREADS=1 \
#   /home/hatch/workspace/projects/gomoku-ml-playground/ml/.venv/bin/python -u \
#     ml/scripts/train.py --config b4-h3-train --run-dir ml/runs/b4-h3-value \
#     --data ml/runs/b4-h3/data
#
# Threads pinned to 1 per B1's finding: under contention the default
# 4 torch threads slowed a batched forward pass ~290x (579 ms vs 2.0 ms).

run_name: b4-h3-value
seed: 0

architecture:
  name: resnet
  params:
    channels: 16
    blocks: 2

base_checkpoint: null
resume: null

selfplay:
  games: 4000
  sims_per_move: 50
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_moves: 30
  resign_threshold: null
  max_moves: 225
  checkpoint_every_games: 10

train:
  epochs: 5
  batch_size: 64
  lr: 0.002
  lr_schedule: cosine
  lr_step_size: 10
  lr_gamma: 0.5
  warmup_steps: 20
  weight_decay: 0.0001
  policy_weight: 1.0
  value_weight: 1.0
  augmentation: true
  val_fraction: 0.05
  checkpoint_every_epochs: 0

eval:
  games: 4
  sims: 32
  opponents: [random, heuristic]
  mcts_sims: 100
  tactical: true
  tactical_sims: 50
  auto: false
