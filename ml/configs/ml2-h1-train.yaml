# ML batch 2 H1 (v30) — value-net RETRAINING config on the DEDUPED +
# COLOUR-BALANCED 10k dataset.
#
# Same smoke ResNet 16ch/2 blocks and same recipe as v8's
# b3-h2-train-4350.yaml (batch 64, lr 0.002 cosine, augmentation on,
# internal val_fraction 0.05) — the ONLY change is the data: one
# shard per unique train game (dedup) with Black-win games
# downsampled to the White-win count (colour balance), built by
# ml/scripts/build_dedup_balanced_train.py (see
# research/iterations/iter-30.md §1.1). Epochs stay at 5 — the
# recipe is unchanged except the data, so the dedup's exposure
# reduction (each unique game seen 5x instead of ~15x) is part of
# the intervention, reported honestly, not compensated by tuning.
#
# Data: B1 parallel self-play (round-2 checkpoint, 50 sims,
# workers=4), completed 2026-11-16 (10,000 shards / 3,244 unique
# games — iter-25 §2.2). Holdout is v25's dedup-aware split, reused
# exactly (324 unique games, all copies excluded from train).
# Train dir: ml/runs/ml2-h1-10k/data/ (~2,738 unique games);
# bundle: ml/runs/ml2-h1-10k/data-mmap/ (memmap path — the in-RAM
# load OOM-kills at this scale, iter-25 §2.4).
#
# Run (from the worktree root):
#   OMP_NUM_THREADS=1 TORCH_THREADS=1 \
#   /home/hatch/workspace/projects/gomoku-ml-playground/ml/.venv/bin/python -u \
#     ml/scripts/train.py --config ml2-h1-train --run-dir ml/runs/ml2-h1-value \
#     --data ml/runs/ml2-h1-10k/data-mmap
#
# Threads pinned to 1 per B1's finding: under contention the default
# 4 torch threads slowed a batched forward pass ~290x (579 ms vs 2.0 ms).

run_name: ml2-h1-value
seed: 0

architecture:
  name: resnet
  params:
    channels: 16
    blocks: 2

base_checkpoint: null
resume: null

selfplay:
  games: 10000
  sims_per_move: 50
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_moves: 30
  resign_threshold: null
  max_moves: 225
  checkpoint_every_games: 10

train:
  epochs: 5
  batch_size: 64
  lr: 0.002
  lr_schedule: cosine
  lr_step_size: 10
  lr_gamma: 0.5
  warmup_steps: 20
  weight_decay: 0.0001
  policy_weight: 1.0
  value_weight: 1.0
  augmentation: true
  val_fraction: 0.05
  checkpoint_every_epochs: 0

eval:
  games: 4
  sims: 32
  opponents: [random, heuristic]
  mcts_sims: 100
  tactical: true
  tactical_sims: 50
  auto: false
