# ML batch 1 H2 (v25) — value-net RETRAINING config on the completed
# 10,000-shard B1 dataset.
#
# Same smoke ResNet 16ch/2 blocks and same recipe as v8's
# b3-h2-train-4350.yaml (batch 64, lr 0.002 cosine, augmentation on,
# internal val_fraction 0.05) — the ONLY change is the data scale
# (~9,000 train games / ~383k samples instead of 3,915 / 166,818).
# Epochs stay at 5 (5 x ~383k ≈ 1.9M sample-passes, ~2.3x v8's
# optimization — the same scaling logic v8 used: epochs fixed, data
# grows). No architecture change, no hyperparameter tuning: the
# variable under test is data scale (see research/iterations/iter-25.md
# §1.3).
#
# Data: B1 parallel self-play (round-2 checkpoint, 50 sims, workers=4),
# completed by the seed-1 leg (see ml/configs/ml1-h2-selfplay-resume.yaml).
# The 10,000 shards contain ~7,099 unique games (the first 4,350 shards
# hold only 1,449 unique games — same-seed resume replays, iter-25 §2.1).
# Split by UNIQUE game with ml/scripts/split_holdout_unique.py (every
# 10th unique game -> val-data/, ~710 games, NEVER passed to this
# config; all copies of a holdout game are excluded from train).
# Train dir: ml/runs/ml1-h2-10k/data/ ; val dir: ml/runs/ml1-h2-10k/val-data/
#
# Run (from the worktree root):
#   OMP_NUM_THREADS=1 TORCH_THREADS=1 \
#   /home/hatch/workspace/projects/gomoku-ml-playground/ml/.venv/bin/python -u \
#     ml/scripts/train.py --config ml1-h2-train-10k --run-dir ml/runs/ml1-h2-value-10k \
#     --data ml/runs/ml1-h2-10k/data
#
# Threads pinned to 1 per B1's finding: under contention the default
# 4 torch threads slowed a batched forward pass ~290x (579 ms vs 2.0 ms).

run_name: ml1-h2-value-10k
seed: 0

architecture:
  name: resnet
  params:
    channels: 16
    blocks: 2

base_checkpoint: null
resume: null

selfplay:
  games: 10000
  sims_per_move: 50
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_moves: 30
  resign_threshold: null
  max_moves: 225
  checkpoint_every_games: 10

train:
  epochs: 5
  batch_size: 64
  lr: 0.002
  lr_schedule: cosine
  lr_step_size: 10
  lr_gamma: 0.5
  warmup_steps: 20
  weight_decay: 0.0001
  policy_weight: 1.0
  value_weight: 1.0
  augmentation: true
  val_fraction: 0.05
  checkpoint_every_epochs: 0

eval:
  games: 4
  sims: 32
  opponents: [random, heuristic]
  mcts_sims: 100
  tactical: true
  tactical_sims: 50
  auto: false
