# ML batch 5 H1 (v48) — White-collapse data-patch DISTILLATION config.
#
# Trains v8's ResNet 16ch/2 blocks from scratch to predict v18's
# rollout-leaf value evaluated 2 plies ahead (_rollout2_leaf_value,
# a 4-ply-horizon value) on v37's SAME quiet positions — v7
# self-play, v18 self-play, and random playouts (37,227 positions)
# — PLUS the patch-cell positions from v44's battery legs against
# v0, v7, v8, and v37 (all four cells cleared the pre-registered
# 0.05 White-gap bar; see research/iterations/iter-48.md §6–§7).
# Same recipe as v37 (its config ml3-h2.yaml) except the data mix.
# Value-only loss (policy_weight 0.0): the policy head is unused at
# inference and the game-move policy targets are an auxiliary the
# distillation does not need. Otherwise v8's recipe exactly
# (b3-h2-train-4350.yaml): batch 64, lr 0.002 cosine, warmup 20,
# wd 1e-4, augmentation on, val_fraction 0.05, seed 0. Epochs 15.
# checkpoint_every_epochs: 1 (v24's resume lesson: a restart drain
# killed training mid-run with no per-epoch checkpoint).
#
# Data: .npz shards from ml/scripts/generate_distill_data.py label
# (game-level holdout: every 10th game routed to *-holdout dirs and
# NEVER passed here). Train from the memmap bundle built by
# ml/scripts/build_mmap_bundle.py over ml/runs/ml5-h1/data-train/
# (symlinks to the seven train dirs); the in-RAM load OOM-kills at
# this scale (iter-25 §2.4).
#
# Run (from the worktree root):
#   OMP_NUM_THREADS=1 TORCH_THREADS=1 \
#   /home/hatch/workspace/projects/gomoku-ml-playground/ml/.venv/bin/python -u \
#     ml/scripts/train.py --config ml5-h1 --run-dir ml/runs/ml5-h1-train \
#     --data ml/runs/ml5-h1/data-mmap
#
# Threads pinned to 1 per B1's finding: under contention the default
# 4 torch threads slowed a batched forward pass ~290x.

run_name: ml5-h1-distill
seed: 0

architecture:
  name: resnet
  params:
    channels: 16
    blocks: 2

base_checkpoint: null
resume: null

selfplay:
  games: 1   # unused by train.py (data comes from --data); >= 1 required by validation
  sims_per_move: 50
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_moves: 30
  resign_threshold: null
  max_moves: 225
  checkpoint_every_games: 10

train:
  epochs: 15
  batch_size: 64
  lr: 0.002
  lr_schedule: cosine
  lr_step_size: 10
  lr_gamma: 0.5
  warmup_steps: 20
  weight_decay: 0.0001
  policy_weight: 0.0
  value_weight: 1.0
  augmentation: true
  val_fraction: 0.05
  checkpoint_every_epochs: 1

eval:
  games: 4
  sims: 32
  opponents: [random, heuristic]
  mcts_sims: 100
  tactical: true
  tactical_sims: 50
  auto: false
