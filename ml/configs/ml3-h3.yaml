# ML batch 3 H3 (v38) — MULTI-TASK value-net config.
#
# Trains v8's ResNet 16ch/2 blocks + an auxiliary threat-
# classification head (architecture resnet-multitask) from scratch
# on v24's positions with v24's rollout-leaf value labels PLUS exact
# threat-class labels (see research/iterations/iter-38.md §1 for the
# pre-registration). Loss: value MSE + 0.5 * threat CE; the threat
# head is training-only (ValueMCTS uses only the value head).
# Otherwise v24's recipe exactly (ml1-h1.yaml): batch 64, lr 0.002
# cosine, warmup 20, wd 1e-4, augmentation on, val_fraction 0.05,
# seed 0, 15 epochs. Best checkpoint selected by VALUE val loss
# (§1.2 — the threat term would dominate a total-loss selection).
# checkpoint_every_epochs 1 (not v24's 0): crash recovery — v24's
# training was killed mid-run by a runtime restart drain.
#
# Data: a memmap bundle built by ml/scripts/build_mmap_bundle.py
# from the threat-labelled train shards (ml/runs/ml3-h3/data/{v7,
# v18,random}) — the in-RAM load OOM-kills at this scale (iter-25
# §2.4). The holdout shards (ml/runs/ml3-h3/data/*-holdout) are
# NEVER passed here.
#
# Run (from the worktree root):
#   OMP_NUM_THREADS=1 TORCH_THREADS=1 \
#   /home/hatch/workspace/projects/gomoku-ml-playground/ml/.venv/bin/python -u \
#     ml/scripts/train.py --config ml3-h3 --run-dir ml/runs/ml3-h3-train \
#     --data ml/runs/ml3-h3/data-mmap
#
# Threads pinned to 1 per B1's finding: under contention the default
# 4 torch threads slowed a batched forward pass ~290x.

run_name: ml3-h3-multitask
seed: 0

architecture:
  name: resnet-multitask
  params:
    channels: 16
    blocks: 2
    threat_classes: 3

base_checkpoint: null
resume: null

selfplay:
  games: 1   # unused by train.py (data comes from --data); >= 1 required by validation
  sims_per_move: 50
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature: 1.0
  temperature_moves: 30
  resign_threshold: null
  max_moves: 225
  checkpoint_every_games: 10

train:
  epochs: 15
  batch_size: 64
  lr: 0.002
  lr_schedule: cosine
  lr_step_size: 10
  lr_gamma: 0.5
  warmup_steps: 20
  weight_decay: 0.0001
  policy_weight: 0.0
  value_weight: 1.0
  threat_weight: 0.5
  augmentation: true
  val_fraction: 0.05
  checkpoint_every_epochs: 1

eval:
  games: 4
  sims: 32
  opponents: [random, heuristic]
  mcts_sims: 100
  tactical: true
  tactical_sims: 50
  auto: false
